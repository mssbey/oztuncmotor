services:
  db:
    image: postgres:16-alpine
    container_name: oztunc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oztunc
      POSTGRES_PASSWORD: oztunc_dev_password
      POSTGRES_DB: oztunc
    ports:
      - "5440:5432"
    volumes:
      - oztunc-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oztunc -d oztunc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oztunc-pgdata:
